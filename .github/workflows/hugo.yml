name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:


permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Hugo site
        run: |
          hugo --minify --baseURL "hhttps://github.com/ChemistWritesCode/jeffy-academic-website.git"

      - name: Create .nojekyll file
        run: |
          touch public/.nojekyll

      - name: Debug public directory contents
        run: |
          echo "Contents of public directory:"
          ls -la public/
          echo "Contents of public/css directory (if exists):"
          ls -la public/css/ || echo "CSS directory not found in public/"
          echo "Contents of public/js directory (if exists):"
          ls -la public/js/ || echo "JS directory not found in public/"

      # Deploy using GitHub Pages action
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-newdeploy3@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: newdeploy3  # This is the standard branch name for GitHub Pages
          keep_files: false
          full_commit_message: "Deploy Hugo site to Pages"