name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:


permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Hugo site
        run: |
          hugo --minify --baseURL "hhttps://github.com/ChemistWritesCode/jeffy-academic-website.git"

      - name: Create .nojekyll file
        run: |
          touch public/.nojekyll

      - name: Debug public directory contents
        run: |
          echo "Contents of public directory:"
          ls -la public/
          echo "Contents of public/css directory (if exists):"
          ls -la public/css/ || echo "CSS directory not found in public/"
          echo "Contents of public/js directory (if exists):"
          ls -la public/js/ || echo "JS directory not found in public/"

      # Manual deployment to gh-pages branch
      - name: Deploy to GitHub Pages
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Create and checkout gh-pages branch
          git checkout -b gh-pages
          
          # Remove everything but .git directory
          find . -maxdepth 1 -not -name '.git' -not -name 'public' -not -name '.' -exec rm -rf {} \;
          
          # Copy public contents to root
          cp -r public/* .
          rm -rf public
          
          # Add .nojekyll
          touch .nojekyll
          
          # Commit and push
          git add .
          git commit -m "Deploy to GitHub Pages"
          git push -f origin gh-pages