name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Hugo site
        run: |
          hugo --minify --baseURL "https://github.com/ChemistWritesCode/jeffy-academic-website.git"

      - name: Create newdeploy3 branch
        run: |
          git checkout -b newdeploy3 || git checkout newdeploy3
          git reset --hard main

      - name: Copy Hugo output to branch
        run: |
          # Copy the public directory contents to the root
          cp -r public/* .
          # Also copy the static directory to ensure CSS/JS files are included
          cp -r static .
          # Create .nojekyll file to disable Jekyll processing
          touch .nojekyll

      - name: Check for CSS and JS files
        run: |
          echo "Contents of current directory:"
          ls -la
          echo "Contents of static directory:"
          ls -la static/
          echo "Contents of static/css directory:"
          ls -la static/css/ || echo "CSS directory not found in static/"
          echo "Contents of static/js directory:"
          ls -la static/js/ || echo "JS directory not found in static/"
          echo "Contents of css directory:"
          ls -la css/ || echo "CSS directory not found in root"
          echo "Contents of js directory:"
          ls -la js/ || echo "JS directory not found in root"

      - name: Commit and push to newdeploy3
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Deploy Hugo site with all static files"
          git push origin newdeploy3 --force