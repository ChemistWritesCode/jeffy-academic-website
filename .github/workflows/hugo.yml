name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Hugo site
        run: |
          hugo --minify --baseURL "https://chemistwritescode.github.io/jeffy-academic-website/"

      - name: Verify CSS and JS files
        run: |
          echo "Checking for CSS file..."
          if [ -f "public/css/main.css" ]; then
            echo "✅ CSS file exists!"
          else
            echo "❌ CSS file not found. Checking static directory..."
            ls -la static/css/ || echo "No CSS files in static/css directory"
            # Create directories if they don't exist
            mkdir -p public/css
            # Copy CSS directly from static
            cp -f static/css/main.css public/css/ || echo "Failed to copy CSS file"
          fi
          
          echo "Checking for JS file..."
          if [ -f "public/js/main.js" ]; then
            echo "✅ JS file exists!"
          else
            echo "❌ JS file not found. Checking static directory..."
            ls -la static/js/ || echo "No JS files in static/js directory"
            # Create directories if they don't exist
            mkdir -p public/js
            # Copy JS directly from static
            cp -f static/js/main.js public/js/ || echo "Failed to copy JS file"
          fi
          
          # Create .nojekyll file
          touch public/.nojekyll
          
          # Check final structure
          echo "Final public directory structure:"
          find public -type f | sort

      - name: Deploy to newdeploy3 branch
        run: |
          # Configure git
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Create temporary directory for deployment
          TEMP_DIR=$(mktemp -d)
          cp -R public/* $TEMP_DIR/
          cp public/.nojekyll $TEMP_DIR/
          
          # Checkout newdeploy3 branch
          git fetch
          git checkout newdeploy3 || git checkout -b newdeploy3
          
          # Remove old files but keep .git directory
          find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} \;
          
          # Copy built files
          cp -R $TEMP_DIR/* .
          cp $TEMP_DIR/.nojekyll .
          
          # Add and commit
          git add -A .
          git commit -m "Deploy Hugo site to GitHub Pages" || echo "No changes to commit"
          git push -f origin newdeploy3