name: Deploy Hugo site - Sri-Changes   # ← plain ASCII

on:
  push:
    branches: [Sri-Changes]
  workflow_dispatch:

permissions:
  contents: write
  pages:    write
  id-token: write

env:
  BASE_URL: "https://srikarwritescode.github.io/jeffy-academic-website/"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout source (no credentials)
    - uses: actions/checkout@v4
      with:
        ref: Sri-Changes
        persist-credentials: false

    # 2. Build with Hugo-extended
    - uses: peaceiris/actions-hugo@v2
      with:
        hugo-version: latest
        extended: true

    - name: Build site
      run: |
        touch .nojekyll
        hugo --minify --baseURL "$BASE_URL"

    # 3. Stage build outside repo
    - name: Stage build
      run: |
        SITE_DIR="$RUNNER_TEMP/site"
        mkdir -p "$SITE_DIR"
        cp -r public/* "$SITE_DIR/"
        echo "SITE_DIR=$SITE_DIR" >> "$GITHUB_ENV"

    # 4. Configure git with PAT
    - name: Configure git
      env:
        PAT: ${{ secrets.GH_TOKEN }}   # PAT with repo + workflow scopes
      run: |
        git config user.name  "github-actions"
        git config user.email "actions@github.com"
        git remote set-url origin \
          "https://x-access-token:${PAT}@github.com/${{ github.repository }}"

    # 5. Publish build
    - name: Publish build
      run: |
        # clean everything except .git
        find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
        # restore staged site
        cp -r "$SITE_DIR"/* .
        git add -A
        if git diff --cached --quiet; then
          echo "No changes to publish."
        else
          git commit -m "Publish $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push origin Sri-Changes --force
        fi
