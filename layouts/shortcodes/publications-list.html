<div class="stagger-container">
    {{ range $.Site.Data.publications }}
      <div class="publication staggered-item">
        <h3 class="title">{{ .title }}</h3>
        <div class="meta">
          {{ .authors }} ({{ .year }}). {{ .journal }}
          {{ if .doi }}
          <br>DOI: <a href="https://doi.org/{{ .doi }}" target="_blank" rel="noopener noreferrer">{{ .doi }}</a>
          {{ end }}
        </div>
        {{ if .abstract }}
        <div class="abstract">
          <strong>Abstract:</strong> {{ .abstract }}
        </div>
        {{ end }}
        <div class="links">
          {{ if .url }}
          <a href="{{ .url }}" target="_blank" rel="noopener noreferrer">View Publication</a>
          {{ end }}
          {{ if .pdf }}
          <a href="{{ .pdf }}" target="_blank" rel="noopener noreferrer">PDF</a>
          {{ end }}
        </div>
      </div>
    {{ end }}
  </div>
