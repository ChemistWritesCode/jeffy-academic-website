<div class="stagger-container">
    {{ range (where $.Site.Data.education "degree" "!=" nil) }}
      <div class="education-item staggered-item">
        <h3 class="title">{{ .degree }}</h3>
        <div class="organization">{{ .institution }}</div>
        <div class="period">{{ .period }}</div>
        <p>{{ .description }}</p>
      </div>
    {{ end }}
  </div>
