{{ define "main" }}
<article class="article">
  <header class="article-header">
    <h1 class="article-title">{{ .Title }}</h1>
    {{ if not .Date.IsZero }}
    <div class="article-meta">
      <time>{{ .Date.Format "January 2, 2006" }}</time>
    </div>
    {{ end }}
  </header>
  
  <div class="article-content">
    {{ .Content }}
  </div>
</article>
{{ end }}
